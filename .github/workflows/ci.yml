name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm ,fetch-depth: 0}
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npm run demo > demo-analysis.json
      - uses: actions/upload-artifact@v4
        with: { name: risk-analysis, path: demo-analysis.json }
