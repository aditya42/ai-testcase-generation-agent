name: AI Test Generation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sample-app/**'
      - 'apps/api/**'
permissions:
  contents: read
jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Generate risk-based tests
        run: npm run agent -w apps/api -- --input ../../sample-app/artifacts.json --out ../../generated-tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o-mini
      - uses: actions/upload-artifact@v4
        with:
          name: ai-generated-test-proposals
          path: generated-tests/
